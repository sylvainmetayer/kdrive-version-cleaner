[package]
name = "kdvc"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "TUI pour visualiser et nettoyer les anciennes versions des fichiers d'un kDrive Infomaniak"
repository = "https://github.com/sylvainmetayer/kdrive-version-cleaner"
readme = "README.md"
keywords = ["kdrive", "infomaniak", "tui", "ratatui", "cleanup"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = "1.4.0"
directories = "6.0.0"
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
