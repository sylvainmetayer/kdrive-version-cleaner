# SonarQube Cloud : créez le projet sur https://sonarcloud.io, puis ajoutez le
# secret SONAR_TOKEN au dépôt. Organisation SonarQube Cloud liée au compte GitHub sylvainmetayer.
sonar.organization=sylvainmetayer-github
sonar.projectKey=sylvainmetayer_kdrive-version-cleaner
sonar.projectName=kdrive-version-cleaner

sonar.sources=src
# Les tests unitaires sont inline (#[cfg(test)]) : seuls ceux de tests/ sont déclarés.
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Rapports produits par le job « Couverture & SonarQube »
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy.json
